name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@10.0.0 --activate

      - name: Install dsh CLI
        run: npm i -g @deepseek-ai/dsh@0.1.5-rc.2

      - name: Install workspace deps
        run: pnpm install

      - name: Link core mirror into workspace
        run: node scripts/link-core.mjs

      # Build runs before Typecheck: the SPA typechecks against
      # dsh-balbes-contracts whose types point at ./lib/* (gitignored, produced
      # only by the Build step). pnpm -r builds in topological order, so
      # contracts' lib/ exists before the admin SPA typecheck runs — on a fresh
      # checkout the first CI push would otherwise fail TS2307.
      - name: Build packages
        run: pnpm -r --if-present run build

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Unit tests (no LLM)
        run: pnpm -r --if-present run test

      - name: Sync balbes profile + host bundle into DSH_HOME
        run: |
          mkdir -p "$HOME/.dsh/profiles"
          cp -R profiles/balbes "$HOME/.dsh/profiles/balbes"
          mkdir -p "$HOME/.dsh/profiles/balbes/node_modules"
          cp -R packages/bundles/dsh-balbes-host "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-host"
          rm -f "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-host/tsconfig.json"
          rm -rf "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-host/tests" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-host/src" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-host/lib/types"
          mkdir -p "$HOME/.dsh/profiles/balbes/node_modules"
          cp -R packages/plugins/dsh-balbes-workspaces "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-workspaces"
          rm -f "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-workspaces/tsconfig.json" \
                "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-workspaces/tsconfig.build.json"
          rm -rf "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-workspaces/tests" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-workspaces/src" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-workspaces/lib/types"
          cp -R packages/plugins/dsh-balbes-models "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-models"
          rm -f "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-models/tsconfig.json" \
                "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-models/tsconfig.build.json"
          rm -rf "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-models/tests" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-models/src" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-models/lib/types"
          cp -R packages/plugins/dsh-balbes-telegram "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-telegram"
          rm -f "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-telegram/tsconfig.json" \
                "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-telegram/tsconfig.build.json"
          rm -rf "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-telegram/tests" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-telegram/src" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-telegram/lib/types"
          cp -R packages/plugins/dsh-balbes-sessions "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-sessions"
          rm -f "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-sessions/tsconfig.json" \
                "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-sessions/tsconfig.build.json"
          rm -rf "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-sessions/tests" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-sessions/src" \
                 "$HOME/.dsh/profiles/balbes/node_modules/dsh-balbes-sessions/lib/types"

      - name: Validate profile composition (no LLM)
        run: dsh --profile balbes --dump-config >/dev/null

      - name: Assert no headless / web app in profile
        run: |
          ! dsh --profile balbes --dump-config | grep -q "dsh-headless\|dsh-web-app"

      - name: Validate installer syntax
        run: bash -n scripts/install.sh

      - name: Validate profile manifest is JSON
        run: node -e "JSON.parse(require('fs').readFileSync('profiles/balbes/package.json','utf8'))"

  # The REAL suites compose the shipped code against a real dsh boot (real
  # Loader, real agent loop, real tool registry, real fs sandbox, real profile
  # CLI). They are the only evidence for the composition seams and the
  # containment policy, and they rot silently if nothing runs them: this job is
  # the reason the Telegram agent-surface restriction and the platform-aware
  # bash probe stay verified. RUN_REAL=1 is the suite gate; without a `dsh` on
  # PATH every REAL test skips, so the global install below is mandatory.
  real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@10.0.0 --activate

      - name: Install dsh CLI
        run: npm i -g @deepseek-ai/dsh@0.1.5-rc.2

      - name: Install workspace deps
        run: pnpm install

      - name: Link core mirror into workspace
        run: node scripts/link-core.mjs

      - name: Build packages
        run: pnpm -r --if-present run build

      - name: REAL suites — host bundle (composition seams + fs/bash containment)
        working-directory: packages/bundles/dsh-balbes-host
        env:
          RUN_REAL: "1"
        run: bash node_modules/.bin/vitest run tests/seams.test.ts tests/integration.test.ts

      - name: REAL suites — telegram channel (agent surface, containment, profile composition)
        working-directory: packages/plugins/dsh-balbes-telegram
        env:
          RUN_REAL: "1"
        run: bash node_modules/.bin/vitest run tests/agentTask.real.test.ts tests/integration.test.ts

      - name: REAL suites — workspace sessions (registry + sessions.list)
        working-directory: packages/plugins/dsh-balbes-sessions
        env:
          RUN_REAL: "1"
        run: bash node_modules/.bin/vitest run tests/integration.test.ts
