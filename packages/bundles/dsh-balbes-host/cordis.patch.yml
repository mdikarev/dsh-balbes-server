# dsh-balbes-host bundle patch: the balbes server surface over dsh-base.
# Overrides base rows by id (whole-config replacement), then inserts the
# server plugins. Applies after dsh-base; profile patch and --patch follow.

- id: system-prompt
  config:
    # dsh 0.1.5-rc.2: the deployment persona is the `personaPrefix` /
    # `personaSuffix` config (the 0.1.2 `persona` key no longer exists). The
    # whole deployment statement stays in the prefix so both facts sit before
    # first-party guidance, exactly as the single 0.1.2 block did. `{{model}}`
    # and `{{cwd}}` remain registered by dsh-agent-loop; interpolation is
    # strict, so only those two names may be referenced. `includeHarnessIdentity`
    # is left at its default (true): the engine's own web/sdk/headless overlays
    # do the same, and the fixed harness identity precedes this prefix.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Global agent home context: the shared, cross-project agent home
# ($DSH_HOME/agent) feeds both instruction discovery and the skills catalog.
# Overrides replace a row's whole config, so agent-instructions restates maxBytes.
- id: agent-instructions
  config:
    maxBytes: 65536
    dshHome: !!js (process.env.DSH_HOME ?? (process.env.HOME + "/.dsh")) + "/agent"

- id: skill-filesystem
  config:
    customSkillDirs: !!js "[(process.env.DSH_HOME ?? (process.env.HOME + \"/.dsh\")) + \"/agent/skills\"]"

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: balbes-startup
      name: 'dsh-balbes-host/startup'

    - id: balbes-server
      name: 'dsh-balbes-host/server'
      config:
        host: '0.0.0.0'
        port: !!js "Number(process.env.BALBES_PORT ?? 8080)"

    - id: balbes-static
      name: 'dsh-balbes-host/static'
      config:
        uiDistDir: !!js "process.env.BALBES_UI_DIST"

    - id: balbes-auth
      name: 'dsh-balbes-host/auth'

    - id: balbes-api
      name: 'dsh-balbes-host/api'
