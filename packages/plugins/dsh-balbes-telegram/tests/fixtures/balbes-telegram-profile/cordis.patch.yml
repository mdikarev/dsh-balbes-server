# Profile patch of the telegram REAL composition: dsh-base + the balbes host
# bundle (from package.json), plus the four standalone plugins this scenario
# needs.
#
# `balbes-workspaces` provides the `balbesWorkspaces` service AND the
# /api/workspaces/* routes the scenario drives to create projects;
# `balbes-sessions` provides the `balbesSessions` service the plugin under test
# registers its workspace sessions in (and owns $DSH_HOME/workspace-sessions.json);
# `balbes-models` provides the `balbesModels` service the /model picker writes
# through (`saveDefault`) and the /api/models/* routes;
# `balbes-telegram` is the plugin under test (its `inject` list needs
# `balbesHttp`, `settings`, `credentials`, `balbesWorkspaces`, `balbesSessions`,
# `agents`, `sessions`, `agentDefaultModel` and `balbesModels` — Cordis has no
# optional inject, so a profile that composes this channel MUST also compose
# both the sessions and the models plugins, exactly as the deployable `balbes`
# profile does).
#
# `session-title-llm` is disabled for stub determinism: a fresh session
# otherwise fires an EXTRA first-prompt model request (Task 1 seam fact 10),
# which would consume a scripted stub entry that belongs to the task turn.
# Disabling the row (rather than tolerating the extra request) keeps every
# scripted turn aligned with exactly one agent request.

- id: session-title-llm
  disabled: true

- insert:
    - id: balbes-workspaces
      name: 'dsh-balbes-workspaces'
    - id: balbes-sessions
      name: 'dsh-balbes-sessions'
    - id: balbes-models
      name: 'dsh-balbes-models'
    - id: balbes-telegram
      name: 'dsh-balbes-telegram'
